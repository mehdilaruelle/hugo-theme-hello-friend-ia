# The theme's text formats. A site pays for one only by asking for it in its
# own [outputs].
[outputFormats]
  [outputFormats.llms]
    mediaType      = "text/plain"
    baseName       = "llms"
    isPlainText    = true
    notAlternative = true

  [outputFormats.md]
    mediaType      = "text/markdown"
    baseName       = "index"
    isPlainText    = true
    notAlternative = true

  # llms.txt is the map, this is the territory: the same pages, in the same
  # order, carrying their text rather than a link to it. One request instead of
  # one per page. params.llmsFullLimit caps how many.
  [outputFormats.llmsfull]
    mediaType      = "text/plain"
    baseName       = "llms-full"
    isPlainText    = true
    notAlternative = true
