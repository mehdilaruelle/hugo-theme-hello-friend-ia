name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly canary against the newest Hugo, see the `latest` job below.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.164.0
  DART_SASS_VERSION: 1.102.0

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the pull request title and every commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          fail=0

          check() {
            if printf '%s' "$2" | grep -Eq "$pattern"; then
              printf '  ok    %s: %s\n' "$1" "$2"
            else
              printf '  FAIL  %s: %s\n' "$1" "$2"
              fail=1
            fi
          }

          # The title matters on its own: a squash merge takes it as the
          # commit subject on master, which is what the version is read from.
          check "pr title" "${PR_TITLE}"

          while IFS= read -r subject; do
            [ -n "${subject}" ] && check "commit" "${subject}"
          done < <(git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}")

          if [ "${fail}" -ne 0 ]; then
            cat >&2 <<'MSG'

          Subjects must follow Conventional Commits:

              type(optional scope)!: description

          type is one of build, chore, ci, docs, feat, fix, perf, refactor,
          revert, style, test. Append ! for a breaking change.

          See CONTRIBUTING.md.
          MSG
            exit 1
          fi

  build:
    name: Build exampleSite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dart Sass, no warnings allowed
            dart-sass: true
            flags: --panicOnWarning
          - name: libsass fallback
            dart-sass: false
            flags: ""
    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-friend-ng

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Install Dart Sass ${{ env.DART_SASS_VERSION }}
        if: matrix.dart-sass
        run: |
          curl -sSLf \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz
          echo "${PWD}/dart-sass" >> "${GITHUB_PATH}"

      - name: Show toolchain versions
        run: |
          hugo version
          command -v sass >/dev/null && sass --version || echo "Dart Sass: not installed (testing the fallback)"

      - name: Build
        working-directory: hello-friend-ng/exampleSite
        run: hugo --themesDir ../.. --gc ${{ matrix.flags }}

  latest:
    name: Build exampleSite (latest Hugo, canary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-friend-ng

      - name: Resolve and install the newest Hugo and Dart Sass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hugo_version="$(gh api repos/gohugoio/hugo/releases/latest --jq .tag_name | sed 's/^v//')"
          sass_version="$(gh api repos/sass/dart-sass/releases/latest --jq .tag_name)"
          echo "Hugo ${hugo_version}, Dart Sass ${sass_version}"

          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${hugo_version}/hugo_extended_${hugo_version}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

          curl -sSLf \
            "https://github.com/sass/dart-sass/releases/download/${sass_version}/dart-sass-${sass_version}-linux-x64.tar.gz" \
            | tar -xz
          echo "${PWD}/dart-sass" >> "${GITHUB_PATH}"

      - name: Show toolchain versions
        run: |
          hugo version
          sass --version

      - name: Build
        working-directory: hello-friend-ng/exampleSite
        run: hugo --themesDir ../.. --gc --panicOnWarning
