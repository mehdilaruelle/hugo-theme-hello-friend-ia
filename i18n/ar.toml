# Translations for Arabic (Modern Standard)
# https://gohugo.io/content-management/multilingual/#translation-of-strings

# Generic
#
[translations]
other = "الترجمات"

[postAvailable]
other = "متوفر أيضًا بـ"


# 404.html
#
[archives]
other = "الأرشيف"

[home]
other = "الرئيسية"

[notFound]
other = "عذرًا، الصفحة غير موجودة…"


# posts/single.html
#
# Arabic distinguishes zero, one, two, a few (3-10) and many (11-99); Hugo
# supports all five CLDR plural categories, so the count reads naturally at
# every size rather than only at one and many.
[readingTime]
zero  = "أقل من دقيقة"
one   = "دقيقة واحدة"
two   = "دقيقتان"
few   = "{{ .Count }} دقائق"
many  = "{{ .Count }} دقيقة"
other = "{{ .Count }} دقيقة"

[tableOfContents]
other = "المحتويات"

[wordCount]
zero  = "لا كلمات"
one   = "كلمة واحدة"
two   = "كلمتان"
few   = "{{ .Count }} كلمات"
many  = "{{ .Count }} كلمة"
other = "{{ .Count }} كلمة"

[lastModified]
other = "آخر تحديث"

# partials/pagination-list.html
[pagination]
newerPosts = "مقالات أحدث"
olderPosts = "مقالات أقدم"

[skipToContent]
other = "تخطَّ إلى المحتوى"

[copyCode]
other = "نسخ"

[copyCodeDone]
other = "تم النسخ"

[copyCodeFailed]
other = "اضغط Ctrl+C"

# Search
#
[searchLabel]
other = "ابحث في هذا الموقع"

[searchPlaceholder]
other = "اكتب للبحث…"

[searchResultsOne]
other = "نتيجة واحدة"

# Arabic distinguishes six plural categories, and the script can only pick
# between one and not-one. Count-neutral wording is correct at every count
# rather than correct at one of them.
[searchResultsMany]
other = "عدد النتائج: %d"

[searchFailed]
other = "تعذّر تحميل فهرس البحث."

[searchNoScript]
other = "يحتاج البحث إلى جافاسكريبت. يمكن تصفح الأرشيف حسب الوسم والتاريخ."

[searchNoIndex]
other = "البحث غير مُهيَّأ في هذا الموقع."

[searchLoading]
other = "جارٍ البحث…"


# partials/head.html
#
[termDescriptionTag]
other = "كل المقالات الموسومة بـ«{{ .Term }}»."

[termDescriptionCategory]
